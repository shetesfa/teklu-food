<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ክብ ዳራ በኤመራልድ አረንጓዴ -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#34d399" stroke-width="6" stroke-dasharray="16 8" opacity="0.4"/>

  <!-- የምግብ ሳህን እና ክዳን (Food Cloche / Serving Platter) -->
  <g filter="url(#shadow)">
    <!-- የሳህን ታችኛው ትሪ (Tray Base) -->
    <path d="M120 330 C120 318 132 308 148 308 L364 308 C380 308 392 318 392 330 C392 338 382 344 364 344 L148 344 C130 344 120 338 120 330 Z" fill="#ffffff"/>
    
    <!-- የትሪው የታችኛው ሳህን መደገፊያ -->
    <ellipse cx="256" cy="344" rx="100" ry="12" fill="#d1fae5"/>

    <!-- የምግብ ክዳን ጉልላት (Cloche Dome) -->
    <path d="M148 296 C152 200 200 160 256 160 C312 160 360 200 364 296 Z" fill="#ffffff"/>
    
    <!-- የጉልላት እጀታ (Handle Knob) -->
    <circle cx="256" cy="144" r="20" fill="url(#goldGrad)"/>
    <rect x="251" y="156" width="10" height="12" rx="3" fill="url(#goldGrad)"/>
    
    <!-- የእንፋሎት መስመሮች (Delicious Aroma Steam) -->
    <path d="M220 120 Q212 96 224 76" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
    <path d="M256 112 Q264 88 252 64" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    <path d="M292 120 Q300 96 288 76" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>

    <!-- የጌጣጌጥ መስመር በክዳኑ ላይ -->
    <path d="M168 284 Q256 260 344 284" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ጽሑፍ፦ ተክሉ ፉድ (Teklu Food) -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ተክሉ ፉድ</text>
  <text x="256" y="456" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">FOOD &amp; BUSINESS</text>
</svg>

